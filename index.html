<!DOCTYPE html> <html lang="ar" dir="rtl"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>إدارة مصروفاتي</title> <style> * { box-sizing: border-box; } body { margin: 0; padding: 20px; font-family: Arial, sans-serif; background-color: #f4f6f8; color: #222; } h1 { text-align: center; margin-bottom: 30px; } h2 { margin-top: 30px; } /* ===== ملخص الشهر ===== */ .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; } .card { background-color: white; padding: 20px; border-radius: 12px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.08); } .card h3 { margin-top: 0; } .amount { font-size: 24px; font-weight: bold; } /* ===== نموذج إضافة العملية ===== */ .form-box { background-color: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); } label { display: block; margin-bottom: 7px; font-weight: bold; } input, select { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; } button { width: 100%; padding: 13px; border: none; border-radius: 8px; background-color: #222; color: white; font-size: 17px; cursor: pointer; } button:hover { opacity: 0.85; } /* ===== جدول العمليات ===== */ .table-box { background-color: white; padding: 15px; border-radius: 12px; overflow-x: auto; } table { width: 100%; border-collapse: collapse; } th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: center; } th { background-color: #f0f0f0; } /* ===== الموبايل ===== */ @media (max-width: 700px) { .summary { grid-template-columns: 1fr 1fr; } body { padding: 12px; } .amount { font-size: 19px; } } </style> </head> <body> <!-- ===== العنوان ===== --> <h1>💰 إدارة مصروفاتي</h1> <!-- ===== ملخص الشهر ===== --> <h2>📊 ملخص الشهر</h2> <div class="summary"> <div class="card"> <h3>💰 الدخل</h3> <div class="amount">0 جنيه</div> </div> <div class="card"> <h3>💸 المصروفات</h3> <div class="amount">0 جنيه</div> </div> <div class="card"> <h3>🏦 المدخرات</h3> <div class="amount">0 جنيه</div> </div> <div class="card"> <h3>📈 الاستثمارات</h3> <div class="amount">0 جنيه</div> </div> <div class="card"> <h3>💳 الديون</h3> <div class="amount">0 جنيه</div> </div> <div class="card"> <h3>💵 المتبقي</h3> <div class="amount">0 جنيه</div> </div> </div> <!-- ===== إضافة عملية ===== --> <div class="form-box"> <h2>➕ إضافة عملية جديدة</h2> <label for="type"> نوع العملية: </label> <select id="type"> <option value="income"> دخل </option> <option value="expense"> مصروف </option> <option value="saving"> ادخار </option> <option value="investment"> استثمار </option> <option value="debt"> سداد دين </option> </select> <label for="amount"> المبلغ: </label> <input type="number" id="amount" placeholder="اكتب المبلغ" > <label for="date"> التاريخ: </label> <input type="date" id="date" > <label for="description"> البيان: </label> <input type="text" id="description" placeholder="مثلاً: مرتب، بنزين، قسط..." > <button type="button" onclick="addTransaction()" > إضافة العملية </button> </div> <!-- ===== سجل العمليات ===== --> <div class="table-box"> <h2>📋 سجل العمليات</h2> <table> <thead> <tr> <th>التاريخ</th> <th>النوع</th> <th>البيان</th> <th>المبلغ</th> </tr> </thead> <tbody id="transactionsTable"> </tbody> </table> </div> <!-- ===== JavaScript ===== --> <script> // قائمة العمليات let transactions = []; // إضافة عملية function addTransaction() { const type = document.getElementById("type").value; const amount = Number(document.getElementById("amount").value); const date = document.getElementById("date").value; const description = document.getElementById("description").value; // التأكد من البيانات if ( amount <= 0 || date === "" || description.trim() === "" ) { alert("من فضلك أدخل كل البيانات"); return; } // إنشاء العملية const transaction = { type: type, amount: amount, date: date, description: description }; // إضافة العملية transactions.push(transaction); // تحديث الجدول displayTransactions(); // تحديث الحسابات updateSummary(); // تفريغ الخانات document.getElementById("amount").value = ""; document.getElementById("description").value = ""; } // عرض العمليات function displayTransactions() { const tableBody = document.getElementById("transactionsTable"); tableBody.innerHTML = ""; transactions.forEach(function(transaction) { const row = document.createElement("tr"); let typeName = ""; if (transaction.type === "income") { typeName = "دخل"; } else if (transaction.type === "expense") { typeName = "مصروف"; } else if (transaction.type === "saving") { typeName = "ادخار"; } else if (transaction.type === "investment") { typeName = "استثمار"; } else if (transaction.type === "debt") { typeName = "سداد دين"; } row.innerHTML = ` <td> ${transaction.date} </td> <td> ${typeName} </td> <td> ${transaction.description} </td> <td> ${transaction.amount.toLocaleString()} جنيه </td> `; tableBody.appendChild(row); }); } // حساب الملخص function updateSummary() { let income = 0; let expenses = 0; let savings = 0; let investments = 0; let debts = 0; transactions.forEach(function(transaction) { if (transaction.type === "income") { income += transaction.amount; } else if (transaction.type === "expense") { expenses += transaction.amount; } else if (transaction.type === "saving") { savings += transaction.amount; } else if (transaction.type === "investment") { investments += transaction.amount; } else if (transaction.type === "debt") { debts += transaction.amount; } }); // حساب المتبقي const remaining = income - expenses - savings - investments - debts; // الحصول على الكروت const cards = document.querySelectorAll(".amount"); // تحديث الدخل cards[0].textContent = income.toLocaleString() + " جنيه"; // تحديث المصروفات cards[1].textContent = expenses.toLocaleString() + " جنيه"; // تحديث المدخرات cards[2].textContent = savings.toLocaleString() + " جنيه"; // تحديث الاستثمارات cards[3].textContent = investments.toLocaleString() + " جنيه"; // تحديث الديون cards[4].textContent = debts.toLocaleString() + " جنيه"; // تحديث المتبقي cards[5].textContent = remaining.toLocaleString() + " جنيه"; } </script> </body> </html>
