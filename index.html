<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>إدارة مصروفاتي</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        h1 {
            text-align: center;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .card h3 {
            margin-top: 0;
        }

        .amount {
            font-size: 22px;
            font-weight: bold;
        }

        .form-box,
        .table-box {
            background: white;
            padding: 20px;
            margin-top: 25px;
            border-radius: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #eee;
        }

        @media (max-width: 700px) {

            .summary {
                grid-template-columns: 1fr 1fr;
            }

            body {
                padding: 10px;
            }
        }
    </style>

</head>


<body>

    <h1>💰 إدارة مصروفاتي</h1>


    <!-- ===================== -->
    <!-- ملخص الحساب -->
    <!-- ===================== -->

    <h2>📊 ملخص الشهر</h2>

    <div class="summary">

        <div class="card">
            <h3>💰 الدخل</h3>
            <div class="amount" id="income">0 جنيه</div>
        </div>

        <div class="card">
            <h3>💸 المصروفات</h3>
            <div class="amount" id="expenses">0 جنيه</div>
        </div>

        <div class="card">
            <h3>🏦 المدخرات</h3>
            <div class="amount" id="savings">0 جنيه</div>
        </div>

        <div class="card">
            <h3>📈 الاستثمارات</h3>
            <div class="amount" id="investments">0 جنيه</div>
        </div>

        <div class="card">
            <h3>💳 الديون</h3>
            <div class="amount" id="debts">0 جنيه</div>
        </div>

        <div class="card">
            <h3>💵 المتبقي</h3>
            <div class="amount" id="remaining">0 جنيه</div>
        </div>

    </div>


    <!-- ===================== -->
    <!-- إضافة عملية -->
    <!-- ===================== -->

    <div class="form-box">

        <h2>➕ إضافة عملية</h2>

        <label for="type">
            نوع العملية
        </label>

        <select id="type">

            <option value="income">💰 دخل</option>

            <option value="expense">💸 مصروف</option>

            <option value="saving">🏦 ادخار</option>

            <option value="investment">📈 استثمار</option>

            <option value="debt">💳 سداد دين</option>

        </select>


        <label for="amount">
            المبلغ
        </label>

        <input
            id="amount"
            type="number"
            placeholder="مثال: 3000"
        >


        <label for="date">
            التاريخ
        </label>

        <input
            id="date"
            type="date"
        >


        <label for="description">
            البيان
        </label>

        <input
            id="description"
            type="text"
            placeholder="مثال: مرتب - بنزين - قسط"
        >


        <button id="addBtn">
            ➕ إضافة العملية
        </button>

    </div>


    <!-- ===================== -->
    <!-- سجل العمليات -->
    <!-- ===================== -->

    <div class="table-box">

        <h2>📋 سجل العمليات</h2>

        <table>

            <thead>

                <tr>
                    <th>التاريخ</th>
                    <th>النوع</th>
                    <th>البيان</th>
                    <th>المبلغ</th>
                </tr>

            </thead>

            <tbody id="transactions">

            </tbody>

        </table>

    </div>


    <!-- ===================== -->
    <!-- JavaScript -->
    <!-- ===================== -->

    <script>

        // تحميل البيانات المحفوظة
        let data = JSON.parse(
            localStorage.getItem("myMoneyData")
        ) || [];


        // زر الإضافة
        document
            .getElementById("addBtn")
            .addEventListener("click", addTransaction);


        // دالة إضافة العملية
        function addTransaction() {

            let type =
                document.getElementById("type").value;

            let amount =
                Number(
                    document.getElementById("amount").value
                );

            let date =
                document.getElementById("date").value;

            let description =
                document.getElementById("description").value.trim();


            // التأكد من البيانات
            if (!amount) {

                alert("اكتب المبلغ أولاً");

                return;
            }


            if (!date) {

                alert("اختار التاريخ أولاً");

                return;
            }


            if (!description) {

                alert("اكتب البيان أولاً");

                return;
            }


            // إنشاء العملية
            let transaction = {

                type: type,

                amount: amount,

                date: date,

                description: description

            };


            // إضافة العملية
            data.push(transaction);


            // حفظ البيانات
            localStorage.setItem(
                "myMoneyData",
                JSON.stringify(data)
            );


            // تحديث الشاشة
            showData();


            // تنظيف الخانات
            document.getElementById("amount").value = "";

            document.getElementById("description").value = "";


            alert("تم تسجيل العملية ✅");

        }


        // عرض البيانات
        function showData() {

            let table =
                document.getElementById("transactions");


            table.innerHTML = "";


            let income = 0;

            let expenses = 0;

            let savings = 0;

            let investments = 0;

            let debts = 0;


            data.forEach(function(item) {

                let typeName = "";


                if (item.type === "income") {

                    typeName = "دخل";

                    income += item.amount;

                }

                else if (item.type === "expense") {

                    typeName = "مصروف";

                    expenses += item.amount;

                }

                else if (item.type === "saving") {

                    typeName = "ادخار";

                    savings += item.amount;

                }

                else if (item.type === "investment") {

                    typeName = "استثمار";

                    investments += item.amount;

                }

                else if (item.type === "debt") {

                    typeName = "سداد دين";

                    debts += item.amount;

                }


                let row =
                    document.createElement("tr");


                row.innerHTML = `

                    <td>${item.date}</td>

                    <td>${typeName}</td>

                    <td>${item.description}</td>

                    <td>
                        ${item.amount.toLocaleString()}
                        جنيه
                    </td>

                `;


                table.appendChild(row);

            });


            // تحديث الأرقام
            document.getElementById("income").textContent =
                income.toLocaleString() + " جنيه";


            document.getElementById("expenses").textContent =
                expenses.toLocaleString() + " جنيه";


            document.getElementById("savings").textContent =
                savings.toLocaleString() + " جنيه";


            document.getElementById("investments").textContent =
                investments.toLocaleString() + " جنيه";


            document.getElementById("debts").textContent =
                debts.toLocaleString() + " جنيه";


            let remaining =
                income -
                expenses -
                savings -
                investments -
                debts;


            document.getElementById("remaining").textContent =
                remaining.toLocaleString() + " جنيه";

        }


        // تشغيل البيانات عند فتح الصفحة
        showData();

    </script>

</body>

</html>
