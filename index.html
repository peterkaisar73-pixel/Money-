
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>إدارة مصروفاتي</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        h2 {
            margin-top: 25px;
        }

        /* الملخص */

        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .card h3 {
            margin-top: 0;
        }

        .amount {
            font-size: 22px;
            font-weight: bold;
        }

        /* نموذج إضافة العملية */

        .form-box {
            background: white;
            padding: 20px;
            margin-top: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        /* الجدول */

        .table-box {
            background: white;
            padding: 15px;
            margin-top: 25px;
            border-radius: 12px;
            overflow-x: auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #eee;
        }

        /* الموبايل */

        @media (max-width: 700px) {

            .summary {
                grid-template-columns: 1fr 1fr;
            }

            body {
                padding: 12px;
            }

            .amount {
                font-size: 18px;
            }

        }

    </style>

</head>


<body>

    <h1>💰 إدارة مصروفاتي</h1>


    <!-- ملخص الحساب -->

    <h2>📊 ملخص الشهر</h2>

    <div class="summary">

        <div class="card">
            <h3>💰 الدخل</h3>
            <div class="amount" id="incomeTotal">0 جنيه</div>
        </div>

        <div class="card">
            <h3>💸 المصروفات</h3>
            <div class="amount" id="expenseTotal">0 جنيه</div>
        </div>

        <div class="card">
            <h3>🏦 المدخرات</h3>
            <div class="amount" id="savingTotal">0 جنيه</div>
        </div>

        <div class="card">
            <h3>📈 الاستثمارات</h3>
            <div class="amount" id="investmentTotal">0 جنيه</div>
        </div>

        <div class="card">
            <h3>💳 الديون</h3>
            <div class="amount" id="debtTotal">0 جنيه</div>
        </div>

        <div class="card">
            <h3>💵 المتبقي</h3>
            <div class="amount" id="remainingTotal">0 جنيه</div>
        </div>

    </div>


    <!-- إضافة عملية -->

    <div class="form-box">

        <h2>➕ إضافة عملية جديدة</h2>

        <label for="type">
            نوع العملية:
        </label>

        <select id="type">

            <option value="income">دخل</option>

            <option value="expense">مصروف</option>

            <option value="saving">ادخار</option>

            <option value="investment">استثمار</option>

            <option value="debt">سداد دين</option>

        </select>


        <label for="amount">
            المبلغ:
        </label>

        <input
            type="number"
            id="amount"
            placeholder="مثلاً: 3000"
        >


        <label for="date">
            التاريخ:
        </label>

        <input
            type="date"
            id="date"
        >


        <label for="description">
            البيان:
        </label>

        <input
            type="text"
            id="description"
            placeholder="مثلاً: مرتب، بنزين، قسط..."
        >


        <button id="addButton" type="button">
            ➕ إضافة العملية
        </button>

    </div>


    <!-- سجل العمليات -->

    <div class="table-box">

        <h2>📋 سجل العمليات</h2>

        <table>

            <thead>

                <tr>
                    <th>التاريخ</th>
                    <th>النوع</th>
                    <th>البيان</th>
                    <th>المبلغ</th>
                </tr>

            </thead>

            <tbody id="transactionsTable">

            </tbody>

        </table>

    </div>


    <script>

        // هنا هنخزن كل العمليات
        let transactions = [];


        // الحصول على الزر
        const addButton = document.getElementById("addButton");


        // عند الضغط على إضافة العملية
        addButton.addEventListener("click", function () {

            const type =
                document.getElementById("type").value;

            const amount =
                Number(document.getElementById("amount").value);

            const date =
                document.getElementById("date").value;

            const description =
                document.getElementById("description").value.trim();


            // التأكد من البيانات
            if (amount <= 0) {

                alert("من فضلك اكتب مبلغ صحيح");

                return;
            }


            if (date === "") {

                alert("من فضلك اختر التاريخ");

                return;
            }


            if (description === "") {

                alert("من فضلك اكتب البيان");

                return;
            }


            // إنشاء العملية
            const transaction = {

                type: type,

                amount: amount,

                date: date,

                description: description

            };


            // إضافة العملية للقائمة
            transactions.push(transaction);


            // تحديث الجدول
            displayTransactions();


            // تحديث الحسابات
            updateSummary();


            // مسح المبلغ والبيان
            document.getElementById("amount").value = "";

            document.getElementById("description").value = "";


            alert("تمت إضافة العملية بنجاح ✅");

        });


        // عرض العمليات في الجدول
        function displayTransactions() {

            const table =
                document.getElementById("transactionsTable");


            table.innerHTML = "";


            transactions.forEach(function (transaction) {

                let typeName = "";


                if (transaction.type === "income") {
                    typeName = "دخل";
                }

                if (transaction.type === "expense") {
                    typeName = "مصروف";
                }

                if (transaction.type === "saving") {
                    typeName = "ادخار";
                }

                if (transaction.type === "investment") {
                    typeName = "استثمار";
                }

                if (transaction.type === "debt") {
                    typeName = "سداد دين";
                }


                const row = document.createElement("tr");


                row.innerHTML = `
                    <td>${transaction.date}</td>
                    <td>${typeName}</td>
                    <td>${transaction.description}</td>
                    <td>${transaction.amount.toLocaleString("ar-EG")} جنيه</td>
                `;


                table.appendChild(row);

            });

        }


        // تحديث الملخص
        function updateSummary() {

            let income = 0;
            let expenses = 0;
            let savings = 0;
            let investments = 0;
            let debts = 0;


            transactions.forEach(function (transaction) {

                if (transaction.type === "income") {
                    income += transaction.amount;
                }

                else if (transaction.type === "expense") {
                    expenses += transaction.amount;
                }

                else if (transaction.type === "saving") {
                    savings += transaction.amount;
                }

                else if (transaction.type === "investment") {
                    investments += transaction.amount;
                }

                else if (transaction.type === "debt") {
                    debts += transaction.amount;
                }

            });


            const remaining =
                income -
                expenses -
                savings -
                investments -
                debts;


            document.getElementById("incomeTotal").textContent =
                income.toLocaleString("ar-EG") + " جنيه";


            document.getElementById("expenseTotal").textContent =
                expenses.toLocaleString("ar-EG") + " جنيه";


            document.getElementById("savingTotal").textContent =
                savings.toLocaleString("ar-EG") + " جنيه";


            document.getElementById("investmentTotal").textContent =
                investments.toLocaleString("ar-EG") + " جنيه";


            document.getElementById("debtTotal").textContent =
                debts.toLocaleString("ar-EG") + " جنيه";


            document.getElementById("remainingTotal").textContent =
                remaining.toLocaleString("ar-EG") + " جنيه";

        }

    </script>

</body>

</html>
```
